[package]
name = "finder-rs"
version = "0.1.0"
edition = "2021"
default-run = "finder-rs"
license = "MIT"
repository = "https://github.com/TreXito/baf-finder"

# Phase 3 binary crate. Boots from the prod sqlite snapshot, builds the money
# core (finder-core) on real data, and — as later chunks land — sweeps the API,
# runs the pipeline, and serves the COFL ws feed. (release profile at workspace root.)
[dependencies]
# SIMD byte search for the dump Extractor scan (detect.rs feed).
memchr = "2"
# musl's malloc serialises on a global lock and this is a static musl deploy.
# See the #[global_allocator] comment in main.rs for the measured numbers.
mimalloc = { version = "0.1", default-features = false }
finder-core = { path = "../finder-core" }
# Same hasher finder-core uses, so the censored map crosses the crate boundary
# without a rehash. Already in the lock via finder-core — no new crate.
rustc-hash = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "gzip", "stream"] }
chrono = "0.4"
# Detect lanes (detect.rs): Last-Modified header parsing for the conditional-GET
# / single-streamer claim ported from finder-shadow-rs.
httpdate = "1"
# Async runtime + ws server for the COFL flip feed (wsServer.ts port).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
# Flip API (:15100) — hyper 1.x directly rather than a framework: all of these
# are already in the lock via reqwest, so the musl build gains no new crates.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
form_urlencoded = "1"
# HTTP Basic Auth decode for the filter-editor password gate (already in the lock
# via finder-core, so the musl build gains no new crates).
base64 = "0.22"
# SHA-256 + constant-time compare for the public feed key auth (public_ws.rs).
# ring is ALREADY in the lock via reqwest rustls, so this is a direct dep on a
# crate the musl build already compiles: no new crates, no new build risk.
ring = "0.17"


# examples/nbt_probe.rs walks raw NBT to find what the decoder discards, so it
# needs the parser itself rather than finder-core's decoded output. Both are
# already in the lock via finder-core; dev-only, so the prod binary is unchanged.
[dev-dependencies]
simdnbt = "0.10"
# zlib-rs backend: inflate was 85% of decode_item_bytes (9.4us of 11.3us per
# auction). Pure Rust, so the musl static build needs no C toolchain.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
